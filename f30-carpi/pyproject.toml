[project]
name = "f30-carpi"
version = "0.1.0"
description = "Eigenes Infotainment (Raspberry Pi 5) für den BMW F30"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-can>=4.3",
]

[project.optional-dependencies]
# Nur auf dem Pi im Auto nötig
car = [
    "dbus-fast>=2.21",
    "python-mpd2>=3.1",
    "gpiozero>=2.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
carpi = "carpi.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carpi*"]

[tool.setuptools.package-data]
carpi = ["ui/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
